syntax = "proto3";
package account_auth;

import "google/protobuf/timestamp.proto";

import "account_enums.proto";
import "common_enums.proto";


message AccountResponse {
    string id = 1;
    string role_id = 2;
    string first_name = 3;
    string last_name = 4;
    bool verified = 5;
    bool master_user = 6;
    account_enums.AccountStatusEnum user_status = 7;
}

message AccountRegistrationRequest {
    string email = 1;
    string password = 2;
    string first_name = 3;
    string last_name = 4;
    google.protobuf.Timestamp date_of_birth = 5;
    common_enums.GenderEnum gender = 6;
}

message AccountLoginRequest {
    string email = 1;
    string password = 2;
}


service AccountAuthService {
    rpc AccountRegistration(AccountRegistrationRequest) returns (AccountResponse);
    rpc AccountLogin(AccountLoginRequest) returns (AccountResponse);
}
